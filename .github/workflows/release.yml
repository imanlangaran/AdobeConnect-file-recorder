name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(cat VERSION)
          if [ "$TAG" != "$VER" ]; then
            echo "tag '$TAG' does not match VERSION '$VER'" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X github.com/iman-langaran/AdobeConnect-file-recorder/internal/version.Version=${VERSION}"
          for os in linux darwin windows; do
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=amd64 go build -ldflags "$LDFLAGS" -o "dist/ac-rec_${os}_amd64${ext}" ./cmd/ac-rec
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # SemVer pre-release: a version with a hyphen (v0.2.0-rc.1) is a pre-release.
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "Automated release for $TAG. See VERSION in the repo for the source of truth." \
            $PRERELEASE \
            --verify-tag
